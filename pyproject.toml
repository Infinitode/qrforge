[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# Metadata lives in setup.py (the publish workflow seds the version token there),
# so this file only declares the build backend and tool configuration.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
# packages are discovered by setup.py via find_packages()
